<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-normal d-flex align-items-center gap-2">
            <strong th:text="${#authentication.principal.getEmail}"
                    class="ms-2"
                    style="font-size: 0.9em; line-height: 1; display: block;">
            </strong>
            <span class="ms-2 me-2">with roles:</span>
            <span th:each="au : ${#authentication.authorities}"
                  th:text="${au.getAuthority().replace('ROLE_', '')}"
                  style="text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;">
            </span>
        </span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm" style="color: rgba(255, 255, 255, 0.6); background: transparent; border: none; padding: 0.25rem 0.5rem;">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active text-white bg-primary" aria-current="page" href="/admin">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/user">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">
            <div class="pt-3 pb-2">
                <h1 class="display-5 fw-semibold">Admin panel</h1>
            </div>

            <ul class="nav nav-tabs mb-0">
                <li class="nav-item">
                    <a class="nav-link" href="/admin">Users table</a>
                </li>
                <li class="nav-item">
                    <span class="nav-link active" aria-current="page">New User</span>
                </li>
            </ul>

            <div class="card">
                <div class="card-header bg-light">
                    <h4 class="mb-0">Add new user</h4>
                </div>

                <form th:object="${user}"
                      th:action="@{/admin/user}"
                      method="post"
                      class="row g-1"
                      style="max-width: 600px; margin: 0 auto; padding: 20px;">

                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="username" class="form-label fw-bold" style="margin-bottom: 2px;">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Username" th:field="*{username}" style="height: 35px; padding: 0 0 0 10px;" required>
                    </div>

                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="firstName" class="form-label fw-bold" style="margin-bottom: 2px;">First name</label>
                        <input type="text" class="form-control" id="firstName" placeholder="First name" th:field="*{firstName}" style="height: 35px; padding: 0 0 0 10px;">
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="lastName" class="form-label fw-bold" style="margin-bottom: 2px;">Last name</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Last name" th:field="*{lastName}" style="height: 35px; padding: 0 0 0 10px;">
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="age" class="form-label fw-bold" style="margin-bottom: 2px;">Age</label>
                        <input type="number" class="form-control" id="age" placeholder="Age" th:field="*{age}" style="height: 35px; padding: 0 0 0 10px;" min="0" max="120" step="1">
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="email" class="form-label fw-bold" style="margin-bottom: 2px;">Email</label>
                        <input type="text" class="form-control" id="email" placeholder="Email" th:field="*{email}" style="height: 35px; padding: 0 0 0 10px;">
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label for="password" class="form-label fw-bold" style="margin-bottom: 2px;">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Password" th:field="*{password}" style="height: 35px; padding: 0 0 0 10px;">
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <label class="form-label fw-bold d-block" style="margin-bottom: 4px;">Role</label>
                        <div th:each="role : ${roles}"
                             class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="checkbox"
                                   th:field="*{roles}"
                                   th:value="${role.id}"
                                   th:id="${'role-' + role.id}">

                            <label class="form-check-label"
                                   th:for="${'role-' + role.id}"
                                   th:text="${role.name}">
                            </label>
                        </div>
                    </div>
                    <div class="col-12 px-0 text-center" style="margin-bottom: 20px;">
                        <button type="submit" class="btn" style="background-color: #28a745; color: white; padding: 12px 30px; border-radius: 8px; font-weight: 500; border: none;">
                            Add new user
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

</body>
</html>
