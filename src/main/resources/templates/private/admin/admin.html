<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table thead th {
            border-bottom: 2px solid #dee2e6;
            font-size: 0.85rem;
        }
        .table th,
        .table td {
            vertical-align: middle;
            text-align: left;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-normal d-flex align-items-center gap-2">
            <strong id="user-email" class="ms-2" style="font-size: 0.9em; line-height: 1; display: block;"></strong>
            <span class="ms-2 me-2">with roles:</span>
            <span id="user-roles" style="text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;"></span>
        </span>
        <button id="logout-btn" class="btn btn-sm" style="color: rgba(255, 255, 255, 0.6); background: transparent; border: none; padding: 0.25rem 0.5rem;">Logout</button>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link active text-white bg-primary" aria-current="page" href="/admin">Admin</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/user">User</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">

            <div class="pt-3 pb-2">
                <h1 class="display-5 fw-semibold">Admin panel</h1>
            </div>

            <ul class="nav nav-tabs mb-0">
                <li class="nav-item">
                    <span class="nav-link active" aria-current="page">Users table</span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/user/new">New User</a>
                </li>
            </ul>

            <div class="card">
                <div class="card-header bg-light">
                    <h4 class="mb-0">All users</h4>
                </div>

                <div class="card-body p-3">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">First Name</th>
                                <th scope="col">Last Name</th>
                                <th scope="col">Age</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                                <th scope="col">Edit</th>
                                <th scope="col">Delete</th>
                            </tr>
                            </thead>
                            <tbody id="users-table-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Модальное окно Edit -->
<div class="modal fade" id="editUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Заголовок -->
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Edit user</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <form id="editForm">
                <div class="modal-body">
                    <input type="hidden" id="editUserId">

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" id="editUsername" class="form-control" required>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">First name</label>
                        <input type="text" id="editFirstName" class="form-control">
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" id="editLastName" class="form-control">
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" id="editAge" class="form-control" min="0" max="120">
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" id="editEmail" class="form-control">
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" id="editPassword" class="form-control" placeholder="Enter a new password">
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold d-block">Roles</label>
                        <div id="editRolesContainer"></div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Модальное окно Delete -->
<div class="modal fade" id="deleteUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Заголовок -->
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Delete user</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <form id="deleteForm">
                <input type="hidden" id="deleteUserId">

                <div class="modal-body">

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Username</label>
                        <input type="text" id="deleteUsername" class="form-control" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">First name</label>
                        <input type="text" id="deleteFirstName" class="form-control" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Last name</label>
                        <input type="text" id="deleteLastName" class="form-control" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Age</label>
                        <input type="number" id="deleteAge" class="form-control" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Email</label>
                        <input type="email" id="deleteEmail" class="form-control" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold">Password</label>
                        <input type="password" id="deletePassword" class="form-control" placeholder="Password is hidden" disabled>
                    </div>

                    <div class="mb-3 text-center">
                        <label class="form-label fw-bold d-block">Roles</label>
                        <div id="deleteRolesContainer"></div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    let allRoles = [];
    let currentUserEmail = '';

    async function loadUsers() {
        const response = await fetch('/api/users');
        const users = await response.json();

        const tbody = document.getElementById('users-table-body');

        if (users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">There are no users</td></tr>';
            return;
        }

        tbody.innerHTML = users.map(user => {
            const isCurrentUser = user.username === currentUserEmail.split('@')[0];
            const rowClass = isCurrentUser ? 'table-active' : '';
            const rolesHtml = user.roles.map(r => '<span>' + r.name + ' </span>').join('');

            return '<tr class="' + rowClass + '">' +
                '<td>' + user.id + '</td>' +
                '<td>' + (user.firstName || '') + '</td>' +
                '<td>' + (user.lastName || '') + '</td>' +
                '<td>' + (user.age || '') + '</td>' +
                '<td>' + (user.email || '') + '</td>' +
                '<td>' + rolesHtml + '</td>' +
                '<td><button type="button" class="btn btn-sm btn-info text-white" onclick="openEditModal(' + user.id + ')">Edit</button></td>' +
                '<td><button type="button" class="btn btn-sm btn-danger" onclick="openDeleteModal(' + user.id + ')">Delete</button></td>' +
                '</tr>';
        }).join('');
    }

    async function loadRoles() {
        const response = await fetch('/api/users/roles');
        allRoles = await response.json();
    }

    async function loadCurrentUser() {
        const response = await fetch('/api/users/me');
        const user = await response.json();

        currentUserEmail = user.email;
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-roles').textContent = user.roles.map(r => r.name.replace('ROLE_', '')).join(' ');
    }

    async function openEditModal(userId) {
        const response = await fetch('/api/users/' + userId);
        const user = await response.json();

        document.getElementById('editUserId').value = user.id;
        document.getElementById('editUsername').value = user.username;
        document.getElementById('editFirstName').value = user.firstName || '';
        document.getElementById('editLastName').value = user.lastName || '';
        document.getElementById('editAge').value = user.age || '';
        document.getElementById('editEmail').value = user.email || '';
        document.getElementById('editPassword').value = '';

        const rolesContainer = document.getElementById('editRolesContainer');
        rolesContainer.innerHTML = allRoles.map(role => {
            const isChecked = user.roles.some(r => r.id === role.id) ? 'checked' : '';
            return '<div class="form-check form-check-inline">' +
                '<input class="form-check-input edit-role-checkbox" type="checkbox" value="' + role.id + '" id="edit-role-' + role.id + '" ' + isChecked + '>' +
                '<label class="form-check-label" for="edit-role-' + role.id + '">' + role.name + '</label>' +
                '</div>';
        }).join('');

        const modal = new bootstrap.Modal(document.getElementById('editUserModal'));
        modal.show();
    }

    async function openDeleteModal(userId) {
        const response = await fetch('/api/users/' + userId);
        const user = await response.json();

        document.getElementById('deleteUserId').value = user.id;
        document.getElementById('deleteUsername').value = user.username;
        document.getElementById('deleteFirstName').value = user.firstName || '';
        document.getElementById('deleteLastName').value = user.lastName || '';
        document.getElementById('deleteAge').value = user.age || '';
        document.getElementById('deleteEmail').value = user.email || '';

        const rolesContainer = document.getElementById('deleteRolesContainer');
        rolesContainer.innerHTML = allRoles.map(role => {
            const isChecked = user.roles.some(r => r.id === role.id) ? 'checked' : '';
            return '<div class="form-check form-check-inline">' +
                '<input class="form-check-input delete-role-checkbox" type="checkbox" value="' + role.id + '" id="delete-role-' + role.id + '" ' + isChecked + ' disabled>' +
                '<label class="form-check-label" for="delete-role-' + role.id + '">' + role.name + '</label>' +
                '</div>';
        }).join('');

        const modal = new bootstrap.Modal(document.getElementById('deleteUserModal'));
        modal.show();
    }

    document.getElementById('editForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const userId = document.getElementById('editUserId').value;

        const selectedRoleIds = Array.from(document.querySelectorAll('.edit-role-checkbox:checked'))
            .map(cb => ({ id: parseInt(cb.value) }));

        const userData = {
            username: document.getElementById('editUsername').value,
            firstName: document.getElementById('editFirstName').value,
            lastName: document.getElementById('editLastName').value,
            age: parseInt(document.getElementById('editAge').value) || null,
            email: document.getElementById('editEmail').value,
            roles: selectedRoleIds
        };

        const password = document.getElementById('editPassword').value;
        if (password) {
            userData.password = password;
        }

        const response = await fetch('/api/users/' + userId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-TOKEN': getCsrfToken()
            },
            body: JSON.stringify(userData)
        });

        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('editUserModal'));
            modal.hide();
            await loadUsers();
        } else {
            alert('Failed to update user');
        }
    });

    document.getElementById('deleteForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const userId = document.getElementById('deleteUserId').value;

        const response = await fetch('/api/users/' + userId, {
            method: 'DELETE',
            headers: {
                'X-CSRF-TOKEN': getCsrfToken()
            }
        });

        if (response.ok) {
            const modal = bootstrap.Modal.getInstance(document.getElementById('deleteUserModal'));
            modal.hide();
            await loadUsers();
        } else {
            alert('Failed to delete user');
        }
    });

    function getCsrfToken() {
        const name = 'XSRF-TOKEN';
        const value = '; ' + document.cookie;
        const parts = value.split('; ' + name + '=');
        if (parts.length === 2) return parts.pop().split(';').shift();
        return '';
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST' });
        window.location.href = '/login?logout';
    });

    document.addEventListener('DOMContentLoaded', async () => {
        await loadCurrentUser();
        await loadRoles();
        await loadUsers();
    });
</script>

</body>
</html>
