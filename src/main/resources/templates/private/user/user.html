<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Admin panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table thead th {
            border-bottom: 2px solid #dee2e6;
            font-size: 0.85rem;
        }
        .table th,
        .table td {
            vertical-align: middle;
            text-align: left;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fw-normal d-flex align-items-center gap-2">
            <strong th:text="${#authentication.principal.getEmail}"
                    class="ms-2"
                    style="font-size: 0.9em; line-height: 1; display: block;">
            </strong>
            <span class="ms-2 me-2">with roles:</span>
            <span th:each="au : ${#authentication.authorities}"
                  th:text="${au.getAuthority().replace('ROLE_', '')}"
                  style="text-transform: uppercase; letter-spacing: 1px; margin-right: 4px;">
            </span>
        </span>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-sm" style="color: rgba(255, 255, 255, 0.6); background: transparent; border: none; padding: 0.25rem 0.5rem;">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <nav class="col-md-2 d-none d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin}">
                            Admin
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active text-white bg-primary" aria-current="page" th:href="@{/user}">
                            User
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-10 ms-sm-auto px-md-4">

            <div class="pt-3 pb-2">
                <h1 class="display-5 fw-semibold">User information-page</h1>
            </div>

            <div class="card">
                <div class="card-header bg-light">
                    <h4 class="mb-0">About user</h4>
                </div>

                <div class="card-body p-3">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">First Name</th>
                                <th scope="col">Last Name</th>
                                <th scope="col">Age</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:if="${user != null}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.firstName}"></td>
                                <td th:text="${user.lastName}"></td>
                                <td th:text="${user.age}"></td>
                                <td th:text="${user.email}"></td>
                                <td>
                                    <span th:each="r : ${user.roles}"
                                          th:text="${r.name} + ' '">
                                    </span>
                                </td>
                            </tr>

                            <tr th:if="${user == null}">
                                <td colspan="6" class="text-center">
                                    User was not found
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

</body>
</html>
