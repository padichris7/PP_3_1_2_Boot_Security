<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Добро пожаловать</title>

    <link rel="icon" type="image/png" th:href="@{/favicon.png}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light min-vh-100 d-flex flex-column">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1 fw-normal">
            Spring Security App
        </span>
    </div>
</nav>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">

    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <div th:if="${param.success}"
             class="alert alert-success alert-dismissible fade show shadow-sm"
             role="alert">

            <strong>Регистрация завершена!</strong>
            Теперь войдите в систему, используя свои данные.

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Закрыть">
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body text-center p-4 p-md-5">

                <h1 class="display-6 fw-semibold mb-3">
                    Добро пожаловать
                </h1>

                <p class="text-secondary mb-4">
                    Это демонстрационное приложение на
                    Spring Boot, Spring Security и Thymeleaf.
                </p>

                <a class="btn btn-primary btn-lg px-4"
                   th:href="@{/login}">
                    Войти в систему
                </a>

            </div>
        </div>

        <p class="text-center text-secondary small mt-4 mb-0">
            Spring Boot + Spring Security
        </p>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
