<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добро пожаловать</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<h1>Добро пожаловать в приложение</h1>

<p>Это демонстрационное приложение на Spring Boot + Spring Security.</p>

<div>
    <a th:href="@{/login}">Войти в систему</a>
</div>

<div th:if="${param.success}" class="alert alert-success">
    Регистрация прошла успешно. Теперь войдите в систему.
</div>

<p style="margin-top:40px; font-size:0.9em; color:#666;"></p>
</body>
</html>
