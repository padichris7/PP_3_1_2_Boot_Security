<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <!-- Подключаем твой готовый стиль -->
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

<h2>Регистрация нового пользователя</h2>

<!-- Сообщение об успехе (появляется после редиректа на эту же страницу, если что-то пошло не так,
     но обычно мы редиректим на /login?success, так что это скорее для отладки) -->
<div th:if="${param.success}" style="color: green; margin-bottom: 15px; font-weight: bold;">
    Пользователь успешно зарегистрирован! Теперь можно войти.
</div>

<!-- Глобальная ошибка (если в контроллере setAttribute("error", ...)) -->
<div th:if="${error}" style="color: red; margin-bottom: 15px; padding: 8px; border: 1px solid #ffcccc; background: #fff0f0;">
    <strong>Ошибка:</strong> <span th:text="${error}"></span>
</div>

<form th:action="@{/register}" method="post" th:object="${registrationForm}">

    <!-- Логин (обязательное поле) -->
    <label for="username">Логин <span style="color: red;">*</span></label>
    <input type="text" id="username" th:field="*{username}" placeholder="Придумайте логин" />
    <div th:if="${#fields.hasErrors('username')}" style="color: red; font-size: 0.85em;">
        <span th:errors="*{username}"></span>
    </div>

    <!-- Пароль (обязательное + минимальная длина) -->
    <label for="password">Пароль <span style="color: red;">*</span> <small>(минимум 6 символов)</small></label>
    <input type="password" id="password" th:field="*{password}" placeholder="Введите пароль" />
    <div th:if="${#fields.hasErrors('password')}" style="color: red; font-size: 0.85em;">
        <span th:errors="*{password}"></span>
    </div>

    <!-- Имя -->
    <label for="firstName">Имя</label>
    <input type="text" id="firstName" th:field="*{firstName}" placeholder="Ваше имя" />

    <!-- Фамилия -->
    <label for="lastName">Фамилия</label>
    <input type="text" id="lastName" th:field="*{lastName}" placeholder="Ваша фамилия" />

    <!-- Возраст -->
    <label for="age">Возраст</label>
    <input type="number" id="age" th:field="*{age}" placeholder="Ваш возраст" min="0" max="120" />

    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" id="email" th:field="*{email}" placeholder="example@mail.com" />

    <hr>

    <button type="submit">Зарегистрироваться</button>

    <p>
        Уже есть аккаунт? <a href="/login">Войти</a>
    </p>
</form>

</body>
</html>
