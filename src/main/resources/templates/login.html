<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Подключаем Bootstrap для быстрого и аккуратного вида -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="card shadow-sm p-4 w-100" style="max-width: 400px;">
    <h3 class="text-center mb-4">Вход в систему</h3>

    <!-- Блок ошибки: показывается, если param.error=true (неверный логин/пароль) -->
    <div th:if="${param.error}" class="alert alert-danger">
        Неверное имя пользователя или пароль.
    </div>

    <!-- Блок успеха: показывается, если param.logout=true (успешный выход) -->
    <div th:if="${param.logout}" class="alert alert-success">
        Вы успешно вышли из системы.
    </div>

    <!-- Форма логина: критически важно action="/login" и method="post" -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Логин</label>
            <input type="text" id="username" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
</div>

<div th:if="${param.success}" class="alert alert-success">
    Регистрация прошла успешно. Теперь войдите в систему.
</div> <!-- не уверена, что должно быть тут -->

</body>
</html>
