<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 60px;
            padding: 0 15px;
            width: 100%;
        }
        .login-container {
            width: 100%;
            max-width: 340px;
        }
        h3 {
            color: #333;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-control {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            background-color: #fff;
            color: #333;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: none;
            background-color: #fff;
        }
        .btn-signin {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
            width: 100%;
            border: none;
            font-weight: 500;
        }
        .btn-signin:hover {
            background-color: #0056b3;
        }
        .no-margin-bottom {
            margin-bottom: 0 !important;
        }
        .margin-top-button {
            margin-top: 12px;
        }
    </style>

</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <h3>Please sign in</h3>

            <div th:if="${param.error}" class="alert alert-danger">
                Incorrect username or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have successfully logged out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="no-margin-bottom">
                    <label for="username" class="visually-hidden"></label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Email address" autofocus required>
                </div>
                <div class="no-margin-bottom">
                    <label for="password" class="visually-hidden"></label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                </div>

                <div class="margin-top-button">
                    <button type="submit" class="btn btn-signin">Sign in</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
